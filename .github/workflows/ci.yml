name: Rust quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: RF-Rhodes
    steps:
      - name: Check out RF-Rhodes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: RF-Rhodes
          persist-credentials: false
      - name: Check out the compatible SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kalexis1994/rackforge
          ref: 7c17bd4a480d1c0bd7fa18fa4d880e82429dffe1
          path: rackforge
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test Rust contracts and physics
        run: cargo test --locked --workspace
      - name: Build native tools and plugin
        run: cargo build --locked --release --workspace
      - name: Build portable plugin
        run: cargo build --locked --release --target wasm32-unknown-unknown -p rf-rhodes-plugin
      - name: Check Rust PLAY surface lints
        run: cargo clippy --locked -p rf-rhodes-ui --target wasm32-unknown-unknown -- -D warnings
      - name: Install matching browser binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build Rust PLAY surface
        run: cargo run --locked --release -p rf-rhodes-lab -- build-ui
      - name: Render a research reference
        run: cargo run --locked --release -p rf-rhodes-lab -- render --output renders/ci.wav --seconds 0.2 --hold 0.1
      - name: Verify the reference file
        run: cargo run --locked --release -p rf-rhodes-lab -- inspect renders/ci.wav
      - name: Analyze the reference file
        run: cargo run --locked --release -p rf-rhodes-lab -- analyze renders/ci.wav --output renders/ci-analysis.json --note 57 --sustain-end 0.09
      - name: Compare identical audio
        run: cargo run --locked --release -p rf-rhodes-lab -- compare renders/ci.wav renders/ci.wav --output renders/ci-comparison.json
      - name: Measure integration convergence
        run: cargo run --locked --release -p rf-rhodes-lab -- converge --output renders/ci-convergence.json --seconds 0.05
      - name: Audit passive coupled assembly
        run: cargo run --locked --release -p rf-rhodes-lab -- assembly-check --output renders/ci-assembly.json
      - name: Audit coupled free-motion refinement
        run: cargo run --locked --release -p rf-rhodes-lab -- assembly-refinement --output renders/ci-assembly-refinement.json
      - name: Audit geometry-derived tine modes
        run: cargo run --locked --release -p rf-rhodes-lab -- tine-modes --output renders/ci-tine-modes.json
      - name: Audit nine-coordinate modal assembly
        run: cargo run --locked --release -p rf-rhodes-lab -- modal-assembly-check --output renders/ci-modal-assembly.json
      - name: Audit dissipative modal hammer
        run: cargo run --locked --release -p rf-rhodes-lab -- modal-hammer-check --output renders/ci-modal-hammer.json
      - name: Audit material memory coupon
        run: cargo run --locked --release -p rf-rhodes-lab -- hammer-memory-check --output renders/ci-hammer-memory.json
      - name: Audit material-memory hammer impacts and free recovery
        run: cargo run --locked --release -p rf-rhodes-lab -- memory-hammer-check --output renders/ci-memory-hammer.json
      - name: Audit stateful hammer and modal assembly coupling
        run: cargo run --locked --release -p rf-rhodes-lab -- memory-modal-check --output renders/ci-memory-modal.json
      - name: Audit certified hammer free recovery
        run: cargo run --locked --release -p rf-rhodes-lab -- memory-free-check --output renders/ci-memory-free.json
      - name: Audit fourth-order fixed-wall hammer contact
        run: cargo run --locked --release -p rf-rhodes-lab -- memory-contact-check --output renders/ci-memory-contact-rk4.json
      - name: Audit certified moving modal free recovery
        run: cargo run --locked --release -p rf-rhodes-lab -- memory-modal-free-check --output renders/ci-memory-modal-free.json
      - name: Audit error-controlled modal contact
        run: cargo run --locked --release -p rf-rhodes-lab -- memory-modal-adaptive-check --output renders/ci-memory-modal-adaptive.json
      - name: Audit economical contact scheduling
        run: cargo run --locked --release -p rf-rhodes-lab -- memory-modal-economical-check --output renders/ci-memory-modal-economical.json
      - name: Audit coupled fourth-order memory contact
        run: cargo run --locked --release -p rf-rhodes-lab -- memory-modal-rk4-check --output renders/ci-memory-modal-rk4.json
      - name: Qualify modal RK4 contact, free motion and reference resolution
        run: cargo run --locked --release -p rf-rhodes-lab -- memory-modal-rk4-refinement --output renders/ci-memory-modal-rk4-refinement.json
      - name: Qualify modal attack and longer tail sections
        run: cargo run --locked --release -p rf-rhodes-lab -- memory-modal-tail-check --output renders/ci-memory-modal-tail.json
      - name: Verify paired diagonal and dense stiffness states
        run: cargo run --locked --release -p rf-rhodes-lab -- memory-modal-stiffness-timing --output renders/ci-memory-modal-stiffness.json
      - name: Verify paired reused and recomputed contact trials
        run: cargo run --locked --release -p rf-rhodes-lab -- memory-modal-trial-reuse-timing --output renders/ci-memory-modal-trial-reuse.json
      - name: Inspect contact resolution without committing trials
        run: cargo run --locked --release -p rf-rhodes-lab -- memory-contact-resolution --output renders/ci-memory-contact-resolution.json
