name: Release RF-Tines

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: rftines-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Validate and publish RF-Tines
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: RF-Tines
    steps:
      - name: Check out the tagged RF-Tines source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: RF-Tines
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the compatible RackForge host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kalexis1994/rackforge
          ref: 782012f10de903a67511a613fc999b392bf87afe
          path: rackforge
          persist-credentials: false
      - name: Match the tag to the package version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as source:
              print(tomllib.load(source)["workspace"]["package"]["version"])
          PY
          )"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Verify formatting and reproducible dependencies
        run: |
          cargo fmt --all -- --check
          cargo metadata --locked --format-version 1 > /dev/null
      - name: Test production crates
        run: cargo test --locked -p rf-tines-analysis -p rf-tines-dsp -p rf-tines-plugin -p rf-tines-ui
      - name: Test Web surface contracts
        run: "cargo test --locked -p rf-tines-lab --bin rf-tines-lab web_ui::"
      - name: Replay retained physical references
        shell: bash
        run: |
          cargo test --locked -p rf-tines-lab --bin rf-tines-lab transduction::tuning::tests::retained_reference_replays_the_structural_fit_with_portable_precision -- --exact
          cargo test --locked -p rf-tines-lab --bin rf-tines-lab action::regression::generic_action_replays_the_committed_planar_reference_with_portable_precision -- --exact
      - name: Check release lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Install RackForge Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Install matching browser binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build RackForge validators
        run: cargo build --locked --release --manifest-path ../rackforge/Cargo.toml -p rackforge-core -p rackforge-store
      - name: Build portable RF-Tines component
        run: cargo build --locked --release --target wasm32-unknown-unknown -p rf-tines-plugin
      - name: Build, validate and pack RF-Tines
        run: cargo run --locked --release -p rf-tines-lab -- package
      - name: Write SHA-256 checksum
        shell: bash
        run: |
          cd dist
          sha256sum "RF-Tines-${{ steps.version.outputs.version }}.rfplugin" > "RF-Tines-${{ steps.version.outputs.version }}.rfplugin.sha256"
          cp "RF-Tines-${{ steps.version.outputs.version }}.rfplugin" RF-Tines.rfplugin
          sha256sum RF-Tines.rfplugin > RF-Tines.rfplugin.sha256
      - name: Preserve the validated release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RF-Tines-${{ steps.version.outputs.version }}
          path: |
            RF-Tines/dist/RF-Tines-${{ steps.version.outputs.version }}.rfplugin
            RF-Tines/dist/RF-Tines-${{ steps.version.outputs.version }}.rfplugin.sha256
            RF-Tines/dist/RF-Tines.rfplugin
            RF-Tines/dist/RF-Tines.rfplugin.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "RF-Tines ${{ steps.version.outputs.version }}" \
            --generate-notes \
            "dist/RF-Tines-${{ steps.version.outputs.version }}.rfplugin" \
            "dist/RF-Tines-${{ steps.version.outputs.version }}.rfplugin.sha256" \
            dist/RF-Tines.rfplugin \
            dist/RF-Tines.rfplugin.sha256
