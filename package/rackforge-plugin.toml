# Schema 1 intentionally uses RackForge's generic identity during DSP research.
# Branded release packages will move to schema 3 after product artwork exists.
schema_version = 1
id = "org.rackforge.rhodes"
name = "RF-73 Research"
vendor = "RackForge"
version = "0.1.13"
description = "Physical-model Rhodes voicing: pickup law, distance and alignment, hammer hardness, sustain, bell and dynamics with a level-compensated pickup"
kind = "instrument"
state_version = 5
capabilities = ["audio_output", "midi_input", "presets", "state"]
ui_layouts = ["little@1"]
config_mode = true

[api]
major = 1
minor = 11

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"

[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"

[[web_ui.surfaces]]
kind = "config"
entry = "web/config.html"
