# Schema 1 intentionally uses RackForge's generic identity during DSP research.
# Branded release packages will move to schema 3 after product artwork exists.
schema_version = 1
id = "org.rackforge.rhodes"
name = "RF-Rhodes Research"
vendor = "RackForge"
version = "0.1.2"
description = "Physical-model pickup laboratory: three matched variants, smooth A/B and a portable Rust editor"
kind = "instrument"
state_version = 2
capabilities = ["audio_output", "midi_input", "presets", "state"]
ui_layouts = ["little@1"]

[api]
major = 1
minor = 11

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"

[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"
