[package]
name = "matts-reference-runner"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
rf-tines-dsp = { path = "../../crates/rf-tines-dsp" }
rf-tines-analysis = { path = "../../crates/rf-tines-analysis" }
serde_json = "1.0"
[[bin]]
name = "matts_reference"
path = "../../tools/rf-tines-lab/examples/matts_reference.rs"
[[bin]]
name = "matts_fit"
path = "../../tools/rf-tines-lab/examples/matts_fit.rs"
[[bin]]
name = "aperture_diagnostic"
path = "../../tools/rf-tines-lab/examples/aperture_diagnostic.rs"
[[bin]]
name = "continuous_pickup_fit"
path = "../../tools/rf-tines-lab/examples/continuous_pickup_fit.rs"
[profile.release]
lto = "thin"
codegen-units = 1
[[test]]
name = "tone_comparison"
path = "../../crates/rf-tines-analysis/tests/tone_comparison.rs"
[[test]]
name = "pitch_anchor"
path = "../../crates/rf-tines-analysis/tests/pitch_anchor.rs"
[[test]]
name = "wav_input"
path = "../../crates/rf-tines-analysis/tests/wav_input.rs"
[dev-dependencies]
hound = "=3.5.1"
[[bin]]
name = "c5_harmonic_probe"
path = "../../tools/rf-tines-lab/examples/c5_harmonic_probe.rs"
[[test]]
name = "harmonic_probe"
path = "../../crates/rf-tines-analysis/tests/harmonic_probe.rs"
